<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SportsDesk Status</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #070b14;
        color: #f1f5f9;
        margin: 0;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 1rem;
      }
      pre {
        background: #0d1527;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 1rem;
        overflow: auto;
        font-size: 12px;
      }
      .ok {
        color: #10b981;
      }
      .bad {
        color: #ef4444;
      }
    </style>
  </head>
  <body>
    <h1>SportsDesk Status</h1>
    <p id="summary">Loading…</p>
    <pre id="payload"></pre>
    <script>
      // No innerHTML: the repo's check:innerhtml gate treats a dynamic assignment as unsafe even
      // when every branch is a literal. Build the status line from DOM nodes instead.
      function setSummary(tone, label, detail) {
        const summary = document.getElementById("summary");
        const dot = document.createElement("span");
        dot.className = tone;
        dot.textContent = "\u25cf ";
        dot.setAttribute("aria-hidden", "true");
        const text = document.createElement("strong");
        text.textContent = label;
        summary.replaceChildren(dot, text);
        if (detail) {
          const rest = document.createElement("span");
          rest.textContent = " \u2014 " + detail;
          summary.appendChild(rest);
        }
      }

      fetch("/api/status", { cache: "no-store" })
        .then((r) => r.json())
        .then((d) => {
          const failed = Object.entries(d.checks || {})
            .filter(([, state]) => state !== "ok")
            .map(([name]) => name);
          setSummary(
            d.ok ? "ok" : "bad",
            d.ok ? "serving" : "degraded",
            failed.length > 0 ? "failed checks: " + failed.join(", ") : "",
          );
          document.getElementById("payload").textContent = JSON.stringify(
            d,
            null,
            2,
          );
        })
        .catch((e) => {
          setSummary("bad", "unreachable", String(e));
          document.getElementById("payload").textContent = String(e);
        });
    </script>
  </body>
</html>
