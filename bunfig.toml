# Preserve the repository's existing Prettier-compatible formatting.
# https://bun.com/docs/runtime/bunfig#style-options
[fmt]
printWidth = 80
tabWidth = 2
useTabs = false
semi = true
singleQuote = false
ignorePatterns = [
  # Minified portal oracle slices — `bun fmt` skips `*.min.js` on directory scans,
  # and this entry also blocks explicit-path runs (`bun fmt verification/...`).
  "verification/manager-boot-oracle/extracted/**/*.min.js",
  # Pinned portal bundles: manifest.json pins their exact bytes.
  "verification/manager-boot-oracle/pinned/*.js",
  "tests/fixtures/**/*.golden.ast.json5",
  "tests/fixtures/**/*.golden.json",
  "tests/fixtures/fantasy402-sport-catalog-*.json",
  # Generated artifacts (`dist/` and `scratch/` are already skipped via `.gitignore`):
  # the poller/generators own their shape.
  "docs/graph-live-feed.json",
  "docs/backtest-4wk-cfb-nba.json",
  "docs/assets/pipeline-artifacts-metadata.json",
  "docs/combo-uniqueness.json",
  "docs/cross-domain-bridge.json",
  # Compact on purpose: 2.2k agents stay ~94 KB instead of ~220 KB pretty-printed.
  "data/agent-tree.json",
  # Same reason, same generator: 2,465 agents, 122 KB compact vs 228 KB pretty.
  "data/agent-index.json",
  # Tool-owned: `statechart` writes this report verbatim (it puts no blank line under a
  # heading), so formatting it only makes the next gate run dirty the tree again.
  "verification/gen-tokens-zero-drift-gate/report.md",
  "verification/gen-tokens-zero-drift-gate/out/**",
]

# Install keys (linker, globalStore, cache.dir, frozenLockfile, minimumReleaseAge) are owned by the
# machine config at ~/.bunfig.toml. Setting them here would override that SSOT, so they stay out.

# Native Bun lint (Bun 1.5+). Bun 1.4.4 accepts but ignores this section; the enforced
# gate is `bun run lint:check` (oxlint 1.90 + oxlint-tsgolint). Keep this block aligned
# with .oxlintrc.json.
#
# `typeAware` stays off deliberately: the full type-aware pass currently reports 605
# warnings (166 no-floating-promises), and `bun check` has 11 unrelated errors.
[lint]
ignorePatterns = [
  "**/node_modules/**",
  "verification/manager-boot-oracle/pinned/**",
  "scratch/**",
  "Scratch/**",
  "dist/**",
]

[lint.categories]
correctness = "warn"

[lint.rules]
"@typescript-eslint/no-explicit-any" = "error"
"@typescript-eslint/no-require-imports" = "error"
"preserve-caught-error" = "warn"

# Type-aware gate: mirror .oxlintrc.type-aware.json, whose correctness category is off and
# whose eight rules are the only type-aware errors. `bun lint --type-aware` turns on Bun's
# recommended type-aware set, so the rules this repo has not triaged are named explicitly.
"typescript/no-array-delete" = "error"
"typescript/no-duplicate-type-constituents" = "error"
"typescript/no-for-in-array" = "error"
"typescript/no-meaningless-void-operator" = "error"
"typescript/no-unsafe-enum-assignment" = "error"
"typescript/no-unsafe-enum-comparison" = "error"
"typescript/no-useless-default-assignment" = "error"
"typescript/return-await" = ["error", "error-handling-correctness-only"]

# Untriaged recommended type-aware rules (canary `bun lint --type-aware`, 2026-11-04):
# 215 no-base-to-string, 166 no-floating-promises, 74 restrict-template-expressions,
# 40 no-redundant-type-constituents, 10 require-array-sort-compare, 8 await-thenable,
# 6 no-misused-spread, 6 no-implied-eval, 4 unbound-method, 1 no-unsafe-unary-minus.
# Turning one on here (or fixing it) is the ratchet; the counts are the cleanup size.
"@typescript-eslint/no-base-to-string" = "off"
"@typescript-eslint/no-floating-promises" = "off"
"@typescript-eslint/restrict-template-expressions" = "off"
"@typescript-eslint/no-redundant-type-constituents" = "off"
"@typescript-eslint/require-array-sort-compare" = "off"
"@typescript-eslint/await-thenable" = "off"
"@typescript-eslint/no-misused-spread" = "off"
"@typescript-eslint/no-implied-eval" = "off"
"@typescript-eslint/unbound-method" = "off"
"@typescript-eslint/no-unsafe-unary-minus" = "off"

[run]
# Exit automatically when the parent process dies (macOS kqueue EVFILT_PROC/NOTE_EXIT)
# and stop-verify-kill all spawned descendants (including headless Bun.WebView).
noOrphans = true

[console]
# How many levels `console.log` expands before printing `[Object ...]` (Bun's default is 2). 8 keeps
# nested report objects (a secrets row with its mention counts and aliases is 7 deep) readable.
# `bun --console-depth=N` overrides it. Plain `Bun.inspect` is not affected by this setting.
depth = 8

[test]
# Ignore scratch experiments, heavy fixtures, and generated gate artifacts from default test scans.
# Keeps colocated tests in lib/ and scripts/ active without traversing scratch/.
pathIgnorePatterns = [
  "scratch/**",
  "Scratch/**",
  "verification/**",
  "tests/fixtures/**",
]

# Dual coverage reporting: preserves console text table while producing lcov.info for CI
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "tests/**",
  "verification/**",
  "scratch/**",
  "Scratch/**",
  "dist/**",
  "docs/**",
]


