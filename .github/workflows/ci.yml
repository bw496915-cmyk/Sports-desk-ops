name: sportsdesk-ops-ci

on:
  push:
    branches: [main]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.json"
      - "**.jsonl"
      - "**.html"
      - "docs/**"
      - "functions/**"
      - "tokens.toml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.json"
      - "**.jsonl"
      - "**.html"
      - "docs/**"
      - "functions/**"
      - "tokens.toml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportsdesk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile
      - name: Check formatting
        timeout-minutes: 3
        run: bun run format:check
      - name: Type check
        timeout-minutes: 3
        run: bun run typecheck
      - name: Lint
        timeout-minutes: 3
        run: bun run lint:check
      - name: Docs invariants (spec honesty, evidence parity, portal, negative coverage)
        timeout-minutes: 3
        run: bun run test:docs
      - name: "Docs gates (verify_docs: fabricated-contract, freshness, headers, dist)"
        timeout-minutes: 5
        run: bun run verify:docs
      - name: Token SSOT Zero-Drift Gate
        timeout-minutes: 3
        run: bun run gen:tokens:gate
      - name: RequestInit Wire Linter Gate
        timeout-minutes: 3
        run: bun bin/check-fetch-init.ts --verbose
      - name: Safe innerHTML Linter Gate
        timeout-minutes: 3
        run: bun bin/check-innerhtml.ts --verbose
      - name: Schema gate (snapshot parity, fixture drift, gauntlet, EOD smoke)
        timeout-minutes: 5
        env:
          CI: "true"
        run: bun run schema:gate
      - name: Execute Full Verification Test Suite
        timeout-minutes: 5
        run: bun test tests/ --reporter=junit --reporter-outfile=junit-report.xml
      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit-report.xml
