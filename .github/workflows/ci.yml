name: sportsdesk-ops-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportsdesk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Token SSOT Zero-Drift Gate
        run: bun run gen:tokens && git diff --exit-code
      - name: RequestInit Wire Linter Gate
        run: bun bin/check-fetch-init.ts --verbose
      - name: Safe innerHTML Linter Gate
        run: bun bin/check-innerhtml.ts --verbose
      - name: Execute Full Verification Test Suite
        run: bun test tests/
