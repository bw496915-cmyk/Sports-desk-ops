name: sportsdesk-ops-ci

on:
  push:
    branches: [main]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.json"
      - "**.jsonl"
      - "**.html"
      - "docs/**"
      - "infra/**"
      - "design/**"
      - "design/tokens.toml"
      - "package.json"
      - "bun.lock"
      - "verification/**"
      - "market/**"
      - "dsh-plugin/**"
      - "dsh-plugin-*/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.json"
      - "**.jsonl"
      - "**.html"
      - "docs/**"
      - "infra/**"
      - "design/**"
      - "design/tokens.toml"
      - "package.json"
      - "bun.lock"
      - "verification/**"
      - "market/**"
      - "dsh-plugin/**"
      - "dsh-plugin-*/**"
      - ".github/workflows/**"
  # Freshness cadence: the value artifacts cannot be rebuilt in CI (live inputs), but a daily run
  # still fails if the generator inputs drifted or a release tag is unregistered.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportsdesk-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned parseMarketIndex validator — bump with engines.dsh / shipped harness
  HARNESS_VALIDATOR_SHA: 66491b05e3f05ad35bcdd4f6cd7ed26041d9e3db
  HARNESS_VALIDATOR_REF: 66491b05e3f05ad35bcdd4f6cd7ed26041d9e3db

jobs:
  market-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # git pin tests: commit must exist in this repo
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile
      - name: Audit harness validator pin (deepseek-harness checkout)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.HARNESS_VALIDATOR_REF }}
          path: .ci/deepseek-harness
          fetch-depth: 1
      - name: Validate market index (format 1)
        timeout-minutes: 3
        env:
          MARKET_INDEX_HARNESS: .ci/deepseek-harness
          HARNESS_VALIDATOR_SHA: ${{ env.HARNESS_VALIDATOR_SHA }}
          REQUIRE_MARKET_INDEX: "1"
        run: |
          test "$(jq -r .version .ci/deepseek-harness/package.json)" = "0.2.2-rc.1"
          test "$(git -C .ci/deepseek-harness rev-parse HEAD)" = "$HARNESS_VALIDATOR_SHA"
          bun run test:market-index
      - name: Plugin bundle boundary check
        run: bash scripts/check-plugin-boundaries.sh
      - name: Index vs manifest audit
        run: bash scripts/audit-plugins.sh

  verify-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Format check (changed files)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          rc=0
          bun fmt --check --changed="origin/${GITHUB_BASE_REF}" || rc=$?
          if [ "$rc" -eq 1 ]; then echo "::error::unformatted files (bun fmt --check)"; exit 1; fi
          if [ "$rc" -ne 0 ]; then echo "::error::bun fmt failed (exit $rc)"; exit "$rc"; fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        timeout-minutes: 3
        run: bun run typecheck
      - name: Lint
        timeout-minutes: 3
        run: bun run lint:check
      - name: Bun docs & shape manifest baselines
        timeout-minutes: 3
        run: bun run bun:docs-mcp surfaces --check tests/bun_docs_surface_baseline.json && bun scripts/bun_shape_contracts.ts --check && bun test tests/bun_shapes_manifest.test.ts tests/bun_shapes_coverage.test.ts tests/language_coverage.test.ts
      - name: Bun test changed files
        run: bun run test:changed
      - name: Changed dsh-plugin bundles (verify-load)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci/test-changed-plugins.sh
      - name: Cache NSH v0.4.0 toolchain & TypeScript 7 cache
        uses: actions/cache@v4
        with:
          path: |
            .agents/tools/nsh
            .agents/tools/nsh-cache
          key: nsh-v0.4.0-e626a8d-${{ runner.os }}-${{ runner.arch }}
      - name: Changed NSH Desk package (pinned v0.4.0 check + build + headless test + web + signed .nshpkg)
        timeout-minutes: 5
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci/test-changed-nsh.sh

  verify:
    # Full ratchet on main (and unattended cadence), not on pull requests — PRs use verify-changed.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sportsdesk_ci
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # No continue-on-error: masking a failure reported this job green while every later
    # gate was skipped (2026-11-09: format:check failed; typecheck, lint, docs, route
    # surface, secrets and schema never ran). The chain is documented as stopping at the
    # first failure, so a red step must be a red run.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          # audit:release compares docs/releases.json against the tags that exist. A shallow
          # clone does not carry the older docs-v* tags, even with fetch-tags, and the repo is
          # small enough that full history is cheaper than a false failure.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile
      - name: "Pinned CDN asset drift (live origins; scheduled/unattended runs)"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 4
        run: bun run pin:cdn
      - name: Manager boot oracle runtime + slice guard
        timeout-minutes: 2
        run: bun run verify:manager-oracle-slices
      - name: Manager oracle gates (exit 10 BLOCKED ok, 1 FAILED)
        timeout-minutes: 2
        run: bash scripts/ci/run-manager-oracle-gates.sh
      - name: HAR redaction verifier (synthetic green/red)
        timeout-minutes: 2
        run: bun test lib/f402_har_redaction_proof_verify.test.ts
      - name: Check formatting
        timeout-minutes: 3
        run: bun run format:check
      - name: Type check
        timeout-minutes: 3
        run: bun run typecheck
      - name: Lint
        timeout-minutes: 3
        run: bun run lint:check
      - name: Docs invariants (spec honesty, evidence parity, portal, negative coverage)
        timeout-minutes: 3
        run: bun run test:docs
      - name: "Docs gates (verify_docs: fabricated-contract, freshness, headers, dist)"
        timeout-minutes: 5
        run: bun run verify:docs
      - name: "Route surface (served = ledger = spec)"
        timeout-minutes: 2
        run: bun run check:route-surface
      - name: "No credentials in tracked files"
        timeout-minutes: 2
        run: bun run check:secrets
      - name: "Every secret-like env var is in lib/secret_manifest.ts"
        timeout-minutes: 2
        run: bun run audit:secrets
      - name: "Bun docs coverage baseline (catalog vs bun-docs MCP audit, offline)"
        timeout-minutes: 2
        run: bun run bun:docs-mcp surfaces --check tests/bun_docs_surface_baseline.json
      - name: "Ops audit (release registry, archive provenance)"
        timeout-minutes: 2
        run: bun run audit:ops
      - name: "Artifact freshness (generator inputs unchanged since regeneration)"
        timeout-minutes: 2
        run: bun run artifacts:lock
      - name: "Markdown & Task Rendering Gate (Bun.markdown HTML/ANSI/Zstd)"
        timeout-minutes: 2
        run: bun run tasks:render --no-color --columns 0 >/dev/null && bun run docs:render
      - name: Token SSOT Zero-Drift Gate
        timeout-minutes: 3
        run: bun run gen:tokens:gate
      - name: RequestInit Wire Linter Gate
        timeout-minutes: 3
        run: bun bin/check-fetch-init.ts --verbose
      - name: "Safe innerHTML + external-asset SRI gate"
        timeout-minutes: 3
        run: bun bin/check-innerhtml.ts --verbose
      - name: "Signal Honesty Linter Gate"
        timeout-minutes: 3
        run: bun bin/check-signal-honesty.ts --verbose
      - name: Cache NSH v0.4.0 toolchain & TypeScript 7 cache
        uses: actions/cache@v4
        with:
          path: |
            .agents/tools/nsh
            .agents/tools/nsh-cache
          key: nsh-v0.4.0-e626a8d-${{ runner.os }}-${{ runner.arch }}
      - name: "Native Shell Desk Gate (pinned nsh v0.4.0 e626a8d doctor + verify-loop + web + signed .nshpkg)"
        timeout-minutes: 5
        run: bash scripts/ci/install-nsh.sh && bun run nsh:doctor && bun run nsh:verify
      - name: Schema gate (snapshot parity, fixture drift, gauntlet, EOD smoke)
        timeout-minutes: 5
        env:
          CI: "true"
        run: bun run schema:gate
      - name: Audit harness validator pin (deepseek-harness checkout)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.HARNESS_VALIDATOR_REF }}
          path: .ci/deepseek-harness
          fetch-depth: 1
      - name: Validate market index (format 1)
        timeout-minutes: 3
        env:
          MARKET_INDEX_HARNESS: .ci/deepseek-harness
          HARNESS_VALIDATOR_SHA: ${{ env.HARNESS_VALIDATOR_SHA }}
          REQUIRE_MARKET_INDEX: "1"
        run: |
          test "$(jq -r .version .ci/deepseek-harness/package.json)" = "0.2.2-rc.1"
          test "$(git -C .ci/deepseek-harness rev-parse HEAD)" = "$HARNESS_VALIDATOR_SHA"
          bun run test:market-index
      - name: Execute Full Verification Test Suite
        timeout-minutes: 5
        run: bun test tests/ --parallel --reporter=junit --reporter-outfile=junit-report.xml
      - name: "PostgreSQL Integration Test Suite (test:db)"
        timeout-minutes: 3
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: sportsdesk_ci
          PGPASSWORD: ci_test_password
          PGDATABASE: sportsdesk_test
          REQUIRE_DB_TESTS: "1"
        run: bun run test:db
      - name: Colocated capture tests
        timeout-minutes: 2
        run: bun test scripts/capture/webview.test.ts scripts/capture/cookies.test.ts
      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit-report.xml
